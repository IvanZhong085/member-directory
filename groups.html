<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>產業小組表｜雲榮鑽石分會</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C8102E; --red-dark:#A50D26; --red-deep:#7C0A1D;
    --purple:#5B2D8E;
    --leader:#0B6FC2;
    --recruit:#E0242C;
    --ink:#15161B; --muted:#6E727E; --hair:#ECEDF0; --bg-soft:#F7F7F8;
    --c-blue:#54C2F0; --c-yellow:#FFC42E; --c-green:#8CC63F; --c-peach:#FFB27D;
    --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg-soft); color:var(--ink); font-family:var(--sans);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 螢幕工具列(列印隱藏) ── */
  .toolbar{
    position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--hair);
    padding:10px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .toolbar .tip{font-size:12.5px; color:var(--muted); margin-right:auto; line-height:1.5;}
  .tbtn{
    display:inline-flex; align-items:center; gap:6px; border:1.5px solid #DDDFE5; background:#fff;
    color:var(--ink); border-radius:999px; padding:8px 18px; font-size:13.5px; font-weight:700;
    cursor:pointer; text-decoration:none; font-family:inherit;
  }
  .tbtn:hover{border-color:var(--red); color:var(--red); background:#FDF3F5;}
  .tbtn-primary{background:var(--red); border-color:var(--red); color:#fff;}
  .tbtn-primary:hover{background:var(--red-dark); border-color:var(--red-dark); color:#fff;}
  .mode-label{font-size:13px; font-weight:700;}
  .public-status{flex-basis:100%; font-size:12px; color:var(--muted);}
  .public-status:empty{display:none;}

  /* ── 16:9 海報(底圖 = BNI ACCELERATE 品牌版型,960×540) ──
     尺寸與比例由底圖決定:寬 297mm、高 = 297×540/960 = 167.06mm,固定高度不再讓內容撐開。
     底圖量測(300dpi 逐像素):y 0–84% 整片全寬留白 = 內容區;84% 以下是品牌帶
     (左:BNI 標誌與區域名、右下:紅色弧形)。品牌「文字」頂端在 90%,弧形只在
     x>97% 的最右緣爬得比較高 —— padding-bottom 22mm 讓內容區到 86.8%:
     12 組「剛好排滿」,離品牌字還有 3% 呼吸空間,最右欄文字也到不了弧形的位置。 */
  .sheet{
    position:relative; width:297mm; height:167.06mm; margin:16px auto;
    background:#fff; padding:3mm 7mm 22mm;
    box-shadow:0 14px 40px -16px rgba(27,28,34,.28);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  /* 底圖:一律用 <img> 而不是 CSS background —— 存成 JPG 那條路是把版面逐項畫回
     canvas,CSS 背景畫不進去,<img> 可以直接 drawImage。 */
  .sheet-bg{position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;}
  .mast, .grid, .foot{position:relative; z-index:1;}
  /* ── 海報標題 ── */
  .mast{text-align:center; padding:0 0 4px;}
  .mast-title{
    margin:0; font-weight:900; font-size:25px; line-height:1.3; letter-spacing:.045em;
    color:var(--purple); outline:none;
  }
  .mast-title .accent{color:var(--red);}
  .mast-title .count{color:var(--red);}
  .mast-date{
    position:absolute; right:150px; top:8px;   /* QR 在右上角佔約 130px,再靠右會疊到 */ font-size:11px; font-weight:800;
    color:var(--ink); letter-spacing:.06em; outline:none; font-variant-numeric:tabular-nums;
  }

  /* ── 12 組海報網格(6 欄 × 2 列) ── */
  .grid{
    /* min-height:0 不能省:flex item 預設 min-height:auto,不會縮到內容高度以下 ——
       grid 的盒子會跟著內容一起長,fit() 的溢出偵測永遠量到 0,內容就這樣
       靜靜地蓋進底圖的品牌帶。 */
    flex:1; min-height:0; display:grid; grid-template-columns:repeat(6, 1fr);
    gap:calc(8px * var(--s, 1)) calc(9px * var(--s, 1));
    align-content:start; --s:1;
  }
  .g{min-width:0;}
  .g-h{
    background:var(--gc, var(--c-blue));
    border-radius:4px; padding:calc(2.5px * var(--s)) 4px;
    text-align:center; margin-bottom:calc(2.5px * var(--s));
    font-size:calc(10.2px * var(--s)); font-weight:900; letter-spacing:.01em;
    color:var(--ink); white-space:nowrap; overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,.12);
  }
  .g-list{list-style:none; margin:0; padding:0 1px;}
  .g-list li{
    display:flex; gap:calc(4px * var(--s)); align-items:baseline;
    font-size:calc(9.8px * var(--s)); line-height:1.42;
    padding:calc(0.6px * var(--s)) 0;
  }
  .n{flex:none; font-weight:800; letter-spacing:.03em; min-width:calc(42px * var(--s)); white-space:nowrap;}
  .sep{flex:none; color:#C4C7CE; font-weight:400;}
  .t{min-width:0; font-weight:500; color:#26272E;}
  /* 組長:藍字粗體(整列) */
  li.leader .n, li.leader .t{color:var(--leader); font-weight:900;}
  li.leader .sep{color:var(--leader);}
  /* 招募席位:紅字,無姓名、對齊專業別欄 */
  li.recruit{padding-left:calc(46px * var(--s));}
  li.recruit .t{color:var(--recruit); font-weight:700;}
  .sheet.public .g-list li{
    display:block; padding:calc(2px * var(--s)) 0; line-height:1.18;
  }
  .sheet.public .n{display:block; min-width:0;}
  .sheet.public .company, .sheet.public .position{
    display:block; font-size:calc(8.6px * var(--s)); overflow-wrap:anywhere;
  }
  .sheet.public .company{color:#26272E; font-weight:500;}
  .sheet.public .position{color:var(--muted);}

  /* ── QR(右上角) ──
     原本在頁尾,但底圖的下緣整條是品牌帶(標誌文字從 x 22% 一路到右邊的弧形),
     塞 QR 一定壓到 —— 移到右上角,與標題同一水平帶,內容區完整留給 12 組。 */
  .foot{position:absolute; top:2.5mm; right:7mm;}
  .foot-qr{display:flex; align-items:center; gap:7px;}
  .foot-qr canvas{width:44px; height:44px; border:1px solid var(--hair); border-radius:5px; background:#fff;}
  .foot-qr span{font-size:7.4px; color:var(--muted); font-weight:700; letter-spacing:.12em; text-align:right; line-height:1.7;}

  [contenteditable]:hover, [contenteditable]:focus{background:#FDF3F5; border-radius:4px; outline:none;}

  /* ── 列印:一律 A4 橫式紙、16:9 版面,不做直式版本 ──
     下面那組 @media screen 的窄螢幕規則刻意只掛 screen:手機上瀏覽時會變成兩欄好讀,
     但一按列印就回到 6 欄的 16:9 海報 —— 列印出來的東西不該因為你用哪台裝置而不同。
     ⚠ iOS Safari 會忽略 @page 的 size,列印面板要自己選「橫向」。
       想避開這件事就用工具列的「存成 JPG」,那是固定 16:9 比例、跟裝置無關。 */
  @media print{
    body{background:#fff;}
    .toolbar{display:none !important;}
    /* 16:9 的圖印在 A4 橫式紙上:填滿可印寬度(297−9×2=279mm),高度照比例,
       上下自然留白。@page 仍是 A4 橫式 —— 印表機沒有 16:9 的紙。 */
    .sheet{
      width:279mm; height:156.94mm; margin:0; box-shadow:none; padding:3mm 6.5mm 20.7mm;
      break-inside:avoid; page-break-inside:avoid;   /* 不允許被拆成兩頁 */
    }
    @page{size:A4 landscape; margin:7mm 9mm 5mm;}
  }
  @media screen and (max-width:900px){
    /* 窄螢幕改直式兩欄好讀;底圖是 16:9 橫式,硬鋪在直式長版面上只會歪掉,收起來。
       存 JPG 與列印都會先釘回桌面版面,所以產出物永遠帶底圖。 */
    .sheet{width:100%; height:auto; min-height:0; padding:14px;}
    .sheet-bg{display:none;}
    .grid{grid-template-columns:repeat(2, 1fr);}
    .mast-date{position:static; display:block; margin-top:4px;}
    .foot{position:static; margin-top:10px;}
  }
  /* 存成 JPG 時暫時套用:把版面強制釘回桌面 16:9 六欄,不管當下螢幕多窄。
     JPG 是「照著螢幕已排好的版面逐字重畫」,若在手機(窄螢幕 2 欄直式)下直接撷取,
     產出的會是直式長圖、甚至高度超過瀏覽器 canvas 上限而失敗 —— 偏偏這功能就是為
     iOS Safari/手機使用者而存在。這些選擇器比 @media screen 規則更具體,故能覆蓋它。
     (桌面本來就是這個版面,套上去沒有任何變化。) */
  .sheet.exporting{width:297mm; height:167.06mm; min-height:0; padding:3mm 7mm 22mm;}
  .sheet.exporting .sheet-bg{display:block;}
  .sheet.exporting .grid{grid-template-columns:repeat(6, 1fr);}
  .sheet.exporting .mast-date{position:absolute; right:150px; top:8px; margin-top:0; display:block;}
  .sheet.exporting .foot{position:absolute; top:2.5mm; right:7mm; margin-top:0;}
  [hidden]{display:none !important;}
  .large-brand, #large-print{display:none;}
  /* 每組大字長圖：字級固定，只換行、增加高度。390px 是分享圖片的閱讀寬度。 */
  .sheet.large, .sheet.large.exporting{
    width:390px; max-width:100%; height:auto; min-height:0; padding:24px 20px;
    overflow:visible;
  }
  .sheet.large.exporting{max-width:none;}
  .sheet.large .sheet-bg{display:none;}
  .sheet.large .mast{padding:0 0 20px;}
  .sheet.large .mast-title{font-size:22px; line-height:1.5; letter-spacing:.02em;}
  .sheet.large .mast-date{
    position:static; margin:6px 0 0; font-size:14px; line-height:1.5; color:#595E69;
  }
  .sheet.large .grid{display:block; flex:none; --s:1;}
  .sheet.large .g-h{
    padding:14px 10px; margin-bottom:16px; font-size:24px; line-height:1.5;
    white-space:normal; overflow:visible; overflow-wrap:anywhere; border-radius:8px;
  }
  .sheet.large .g-list{padding:0;}
  .sheet.large .g-list li{
    padding:14px; margin-bottom:12px; background:#F5F5F7; border-radius:8px;
  }
  .sheet.large .g-list li:last-child{margin-bottom:0;}
  .sheet.large .n{font-size:28px; line-height:1.5; white-space:normal; overflow-wrap:anywhere;}
  .sheet.large .company{font-size:20px; line-height:1.5; margin-top:6px; color:#26272E;}
  .sheet.large .position{font-size:18px; line-height:1.5; margin-top:5px; color:#595E69;}
  .sheet.large .foot{
    position:static; display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-top:24px;
  }
  .sheet.large .large-brand{display:block; font-size:30px; font-weight:900; color:var(--red);}
  .sheet.large .foot-qr canvas{width:60px; height:60px;}
  .sheet.large .foot-qr span{font-size:12px; line-height:1.6; letter-spacing:0;}
  @media print{
    .sheet.large{width:390px; max-width:none; margin:0; box-shadow:none;}
    body.print-all > .sheet{display:none;}
    body.print-all #large-print{display:block;}
    #large-print .sheet{break-after:page;}
    #large-print .sheet:last-child{break-after:auto;}
  }
  /* 橫式完整單張：四欄依內容高度平衡，姓名下放公司／職稱，保留每一個字。 */
  .sheet.single, .sheet.single.exporting{
    width:2200px; max-width:none; height:auto; min-height:0; padding:12px;
    overflow:visible; margin:12px auto;
  }
  .sheet.single .sheet-bg{display:none;}
  .sheet.single .mast{padding:0 0 9px; text-align:left;}
  .sheet.single .mast-title{font-size:27px; line-height:1.15; letter-spacing:0; padding-right:180px;}
  .sheet.single .mast-date{position:absolute; top:7px; right:0; margin:0; font-size:13px; line-height:1.2; letter-spacing:0;}
  .sheet.single .grid{display:grid; flex:none; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; --s:1;}
  .sheet.single .g{break-inside:avoid; margin-bottom:8px; align-self:start;}
  .sheet.single .g-h{font-size:20px; line-height:1.2; padding:4px 5px; margin-bottom:2px; border-radius:2px; white-space:normal; overflow:visible; box-shadow:none;}
  .sheet.single .g-list{padding:0;}
  .sheet.single .g-list li{padding:3px 5px; margin:0; break-inside:avoid;}
  .sheet.single .g-list li:nth-child(even){background:#F2F3F5;}
  .sheet.single .n{font-size:24px; line-height:1.3; font-weight:900; letter-spacing:0; white-space:normal;}
  .sheet.single .details{display:block; margin-top:5px; font-size:20px; line-height:1.18; overflow-wrap:anywhere;}
  .sheet.single .company{display:inline; font-size:20px; line-height:inherit; font-weight:500; color:#202127;}
  .sheet.single .position{display:inline; font-size:20px; line-height:inherit; color:#454A54;}
  .sheet.single .detail-sep{color:#777C86; font-size:20px;}
  .sheet.single .foot{display:none;}
  .sheet.single .large-brand{display:block; font-size:22px; line-height:1; font-weight:900; color:var(--red);}
  .sheet.single .foot-qr{gap:5px;}
  .sheet.single .foot-qr canvas{width:30px; height:30px; border:0;}
  .sheet.single .foot-qr span{font-size:10px; line-height:1.2; letter-spacing:0;}
  @media print{.sheet.single, .sheet.single.exporting{margin:0; box-shadow:none;}}
</style>
<style id="large-page-size"></style>
</head>
<body>

<div class="toolbar">
  <span class="tip">標題與日期<b>點一下就能改字</b>;各組「招募席位」紅字項目在後台的分組欄位編輯。確認後按「列印/存 PDF」。</span>
  <label class="mode-label" for="view-mode">圖表版本</label>
  <select class="tbtn" id="view-mode">
    <option value="internal">內部產業小組表</option>
      <option value="public-single">對外產業小組圖｜橫式完整單張</option>
    <option value="public">對外產業小組圖｜舊六欄總覽</option>
    <option value="public-large">對外產業小組圖｜每組大字版</option>
  </select>
  <span id="group-picker" hidden>
    <label class="mode-label" for="group-select">產業小組</label>
    <select class="tbtn" id="group-select"></select>
  </span>
  <!-- 首頁現在有大按鈕直通這一頁,來賓也會進來:「回後台」只給從後台開過來的人看,
       用 referrer 判斷;其餘人看到的是「← 回名錄」。 -->
  <a class="tbtn" id="tbtn-admin" href="admin.html" style="display:none">← 回後台</a>
  <a class="tbtn" href="./">← 回名錄</a>
  <button class="tbtn" id="btn-jpg" type="button">🖼 存成 JPG</button>
  <button class="tbtn" id="btn-png" type="button" hidden>存成 PNG</button>
  <button class="tbtn tbtn-primary" id="btn-print" onclick="window.print()" type="button">🖨 列印/存 PDF</button>
  <button class="tbtn" id="btn-print-all" type="button" hidden>全部小組存 PDF</button>
  <span id="public-status" class="public-status" role="status" aria-live="polite"></span>
</div>
<script>
  if(/\/admin\.html(\?|#|$)/.test(document.referrer)) document.getElementById("tbtn-admin").style.display = "";
</script>

<div class="sheet">
  <img class="sheet-bg" src="group-sheet-bg.svg?v=1" alt="" aria-hidden="true">
  <header class="mast">
    <h1 class="mast-title" id="mast-title" contenteditable="true" spellcheck="false"></h1>
    <div class="mast-date" id="sheet-date" contenteditable="true" spellcheck="false"></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer class="foot">
    <span class="large-brand">BNI</span>
    <div class="foot-qr">
      <span>掃描 QR<br>看完整名錄</span>
      <canvas id="foot-qr-canvas" width="176" height="176"></canvas>
    </div>
  </footer>
</div>
<div id="large-print"></div>

<script src="site-config.js?v=1"></script>
<script src="data.js?v=f56559b5"></script>
<script src="data-fresh.js?v=1"></script>
<script src="qrcode.js"></script>
<script src="groups-view.js?v=1"></script>
<script>
(function(){
  "use strict";
  function esc(s){ return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  var total = GROUPS.reduce(function(n,g){ return n + g.members.length; }, 0);
  var requestedMode = new URL(location.href).searchParams.get("view");
  var mode = ["public", "public-large", "public-single"].indexOf(requestedMode) >= 0 ? requestedMode : "internal";
  var requestedGroup = new URL(location.href).searchParams.get("group");
  var groupCode = GROUPS.some(function(g){ return g.code === requestedGroup; }) ? requestedGroup : GROUPS[0].code;
  var titles = {
    internal: esc(SITE.ORG_NAME) + "<span class=\"accent\">成交破億</span>產業小組團隊<span class=\"count\">(" + total + ")</span>",
    public: esc(SITE.ORG_NAME) + " 對外產業小組圖<span class=\"count\">(" + total + ")</span>",
    "public-large": esc(SITE.ORG_NAME) + "｜產業夥伴",
    "public-single": "BNI " + esc(SITE.ORG_NAME) + "｜產業小組圖 <span class=\"count\">" + GROUPS.length + " 組・" + total + " 人</span>"
  };
  var modeSelect = document.getElementById("view-mode");
  var groupSelect = document.getElementById("group-select");
  groupSelect.innerHTML = GROUPS.map(function(g){
    return '<option value="' + esc(g.code) + '">' + esc(g.code + "／" + g.name) + "</option>";
  }).join("");
  document.getElementById("btn-print-all").textContent = "全部 " + GROUPS.length + " 組存 PDF";
  var status = document.getElementById("public-status");
  var d = new Date(), pad = function(n){ return String(n).padStart(2,"0"); };
  document.getElementById("sheet-date").textContent = d.getFullYear() + " /" + pad(d.getMonth()+1) + "/" + pad(d.getDate());

  function render(){
    clearPrintAll();
    var external = mode !== "internal", large = mode === "public-large", single = mode === "public-single";
    modeSelect.value = mode;
    groupSelect.value = groupCode;
    document.getElementById("group-picker").hidden = !large;
    document.getElementById("btn-print-all").hidden = !large;
    document.getElementById("btn-png").hidden = !single;
    document.querySelector(".toolbar .tip").textContent = single ?
      "橫式完整單張：姓名下列出公司與已填職稱，可存 JPG／PNG 或單頁橫式 PDF。" : large ?
      "每組一張大字長圖。姓名、公司、職位完整換行；可選組存 JPG，或將全部小組存為多頁 PDF。" :
      "標題與日期可點一下改字；總覽可存 JPG 或列印。";
    document.title = (external ? "對外產業小組圖" : "產業小組表") + "｜" + SITE.ORG_NAME;
    sheet.classList.toggle("public", external);
    sheet.classList.toggle("large", large);
    sheet.classList.toggle("single", single);
    document.getElementById("mast-title").innerHTML = titles[mode];
    grid.innerHTML = GroupSheet.renderGroups(large ? GROUPS.filter(function(g){ return g.code === groupCode; }) : GROUPS,
      single ? "public-single" : external ? "public" : "internal");
    if(single) balanceSingle();
    status.dataset.state = "ready";
    if(!external) status.textContent = "";
    else {
      var companies = 0, positions = 0;
      GROUPS.forEach(function(g){ g.members.forEach(function(m){
        var p = GroupSheet.publicProfile(m);
        if(p.company) companies++;
        if(p.position) positions++;
      }); });
      status.textContent = "公司 " + companies + "/" + total + "、已填公司職位 " + positions + "/" + total +
        "；職位依夥伴自填資料，未填不推測，不以專業別或分會職務代替。";
    }
    fit();
  }

  /* 頁尾 QR:掃描直達名錄 */
  try{
    var qr = qrcode(0, "M");
    qr.addData(SITE.SITE_BASE);
    qr.make();
    var cv = document.getElementById("foot-qr-canvas");
    var ctx = cv.getContext("2d");
    var n = qr.getModuleCount(), quiet = 2, cell = cv.width / (n + quiet * 2);
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = "#15161B";
    for(var r = 0; r < n; r++) for(var c = 0; c < n; c++)
      if(qr.isDark(r, c)) ctx.fillRect(quiet*cell + c*cell, quiet*cell + r*cell, Math.ceil(cell)+.3, Math.ceil(cell)+.3);
  }catch(e){ var fq = document.querySelector(".foot-qr"); if(fq) fq.style.display = "none"; }

  /* 自動縮放:塞不下縮小、太空放大填滿。
     版面高度現在由底圖比例釘死(16:9),內容多出來不會撐開版面、只會溢出蓋到品牌帶,
     所以判斷改成「內容最低點 vs 網格區的底線」:超過就縮,留白超過 30px 就放大 ——
     這就是「12 組剛好排滿留白區」的機制。 */
  var grid = document.getElementById("grid");
  var sheet = document.querySelector(".sheet");
  var scale = 1, guard = 0;
  function overflowPx(){
    var mx = 0;
    document.querySelectorAll(".g").forEach(function(e){
      var b = e.getBoundingClientRect().bottom;
      if(b > mx) mx = b;
    });
    return mx - grid.getBoundingClientRect().bottom;
  }
  function setScale(v){ scale = v; grid.style.setProperty("--s", scale.toFixed(2)); }
  function balanceSingle(){
    var blocks = Array.prototype.slice.call(grid.querySelectorAll(".g"));
    var heights = blocks.map(function(el){ return el.getBoundingClientRect().height + 8; });
    var columns = [0, 1, 2, 3].map(function(){ var col = document.createElement("div"); col.className = "single-column"; return col; });
    var totals = [0, 0, 0, 0];
    // 先放內容最高的小組減少欄底留白，再按組別原順序整理各欄。
    blocks.map(function(el, i){ return i; }).sort(function(a,b){ return heights[b] - heights[a]; }).forEach(function(i){
      var col = totals.indexOf(Math.min.apply(null, totals));
      columns[col].appendChild(blocks[i]); totals[col] += heights[i];
    });
    columns.forEach(function(col){
      Array.prototype.slice.call(col.children).sort(function(a,b){ return blocks.indexOf(a) - blocks.indexOf(b); }).forEach(function(el){ col.appendChild(el); });
    });
    columns.sort(function(a,b){ return blocks.indexOf(a.firstElementChild) - blocks.indexOf(b.firstElementChild); });
    grid.replaceChildren.apply(grid, columns);
  }
  function fit(){
    sheet.style.zoom = "";
    if(mode === "public-single"){
      setScale(1);
      if(!sheet.classList.contains("exporting") && !window.matchMedia("print").matches)
        sheet.style.zoom = String(Math.min(1, Math.max(0.1, (window.innerWidth - 16) / 2200)));
      return;
    }
    if(mode === "public-large"){ setScale(1); return; }
    if(!sheet.classList.contains("exporting") && !window.matchMedia("print").matches &&
       window.matchMedia("(max-width:900px)").matches){ setScale(1); return; }
    guard = 0; setScale(1);
    while(overflowPx() > 2 && scale > 0.6 && guard < 26){ setScale(scale - 0.03); guard++; }
    guard = 0;
    while(overflowPx() < -30 && scale < 1.6 && guard < 40){ setScale(scale + 0.02); guard++; }
    if(overflowPx() > 2 && scale > 0.64) setScale(scale - 0.02);
  }
  render();
  modeSelect.addEventListener("change", function(){
    titles[mode] = document.getElementById("mast-title").innerHTML;
    mode = modeSelect.value;
    var url = new URL(location.href);
    if(mode !== "internal") url.searchParams.set("view", mode);
    else url.searchParams.delete("view");
    if(mode === "public-large") url.searchParams.set("group", groupCode);
    else url.searchParams.delete("group");
    history.replaceState(null, "", url.href);
    render();
  });
  groupSelect.addEventListener("change", function(){
    titles[mode] = document.getElementById("mast-title").innerHTML;
    groupCode = groupSelect.value;
    var url = new URL(location.href);
    url.searchParams.set("group", groupCode);
    history.replaceState(null, "", url.href);
    render();
  });
  window.addEventListener("resize", fit);
  function clearPrintAll(){
    document.body.classList.remove("print-all");
    document.getElementById("large-print").replaceChildren();
    document.getElementById("large-page-size").textContent = "";
  }
  function setPrintSize(height, width){
    document.getElementById("large-page-size").textContent =
      "@page{size:" + (width || 390) + "px " + Math.ceil(height + 2) + "px;margin:0;}";
  }
  function printAll(){
    if(mode !== "public-large") return;
    clearPrintAll();
    var container = document.getElementById("large-print");
    // 用相同版型建立列印頁，複製 QR 像素；不更動正在看的小組。
    GROUPS.forEach(function(g){
      var copy = sheet.cloneNode(true);
      copy.classList.add("exporting");
      copy.querySelector(".grid").innerHTML = GroupSheet.renderGroups([g], "public");
      copy.querySelectorAll("[id]").forEach(function(el){ el.removeAttribute("id"); });
      copy.querySelector("canvas").getContext("2d").drawImage(document.getElementById("foot-qr-canvas"), 0, 0);
      container.appendChild(copy);
    });
    // 暫時量完整高度，以最高的一組決定長頁紙張；文字字級完全不變。
    container.style.cssText = "display:block;position:absolute;left:-10000px;top:0";
    var maxHeight = 0;
    container.querySelectorAll(".sheet").forEach(function(el){
      maxHeight = Math.max(maxHeight, el.getBoundingClientRect().height);
    });
    container.style.cssText = "";
    setPrintSize(maxHeight);
    document.body.classList.add("print-all");
    window.print();
  }
  document.getElementById("btn-print-all").addEventListener("click", printAll);
  window.addEventListener("beforeprint", function(){
    if(mode === "public-single"){
      sheet.classList.add("exporting"); fit();
      setPrintSize(sheet.getBoundingClientRect().height, 2200);
      return;
    }
    fit();
    if(mode === "public-large" && !document.body.classList.contains("print-all")){
      sheet.classList.add("exporting");
      setPrintSize(sheet.getBoundingClientRect().height);
    }
  });
  window.addEventListener("afterprint", function(){
    sheet.classList.remove("exporting"); clearPrintAll(); fit();
  });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* ══ 存成 JPG ══════════════════════════════════════════════════════════
     固定 16:9(跟底圖同比例),跟裝置、跟瀏覽器的列印面板都無關 —— iOS Safari 會
     忽略 @page 的 size,列印常常跑出直式,這條路繞過那個問題。

     做法是「照著螢幕上已經排好的版面畫」,不是另外寫一套排版:
     每個文字節點用 Range 逐字量位置,依 top 分行,再用 canvas 把每一行畫回原位。
     這樣自動吃到 fit() 算好的縮放、換行、對齊,CSS 之後怎麼改都不用同步改這裡。
     字體也一樣 —— canvas 與頁面同一個文件,用得到已經載好的 Noto Sans TC。

     不用 SVG foreignObject 那條常見的路:它畫不出 <canvas> 內容(QR 會不見),
     載不到外部字體(中文會掉成預設字),而且在 iOS Safari 上時常直接產出空白圖。 */
  function roundRect(ctx, x, y, w, h, r){
    r = Math.min(r || 0, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  /* 一個文字節點 → 逐行的 {text, left, top, bottom}。
     逐字量看起來很笨,但這是唯一能同時吃到自動換行與對齊的方法,
     而這張表全部加起來也才一千多個字,量起來是毫秒等級。 */
  function textLines(node){
    var t = node.nodeValue, out = [], range = document.createRange(), cur = null;
    for(var i = 0; i < t.length; i++){
      range.setStart(node, i); range.setEnd(node, i + 1);
      var rects = range.getClientRects();
      if(!rects.length) continue;
      var r = rects[0];
      if(cur && Math.abs(r.top - cur.top) < 0.8){
        cur.text += t[i];
      } else {
        cur = { text: t[i], left: r.left, top: r.top, bottom: r.bottom };
        out.push(cur);
      }
    }
    return out;
  }

  function paintSheet(scaleK){
    var base = sheet.getBoundingClientRect();
    var cv = document.createElement("canvas");
    cv.width  = Math.round(base.width  * scaleK);
    cv.height = Math.round(base.height * scaleK);
    var ctx = cv.getContext("2d");
    if(!ctx) return null;

    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.scale(scaleK, scaleK);
    ctx.translate(-base.left, -base.top);

    /* ⓪ 底圖(BNI 品牌版型)。它是 <img>(SVG),同源所以 canvas 不會被污染;
       畫在最底層,之後的色塊與文字疊上去 —— 順序就是畫面上的 z-index。 */
    var bg = sheet.querySelector(".sheet-bg");
    if(bg && bg.complete && bg.naturalWidth){
      var rbg = bg.getBoundingClientRect();
      try{ ctx.drawImage(bg, rbg.left, rbg.top, rbg.width, rbg.height); }catch(e){}
    }

    // ① 有底色的方塊(各組的彩色標題列)
    var all = sheet.querySelectorAll("*");
    for(var i = 0; i < all.length; i++){
      var el = all[i], cs = getComputedStyle(el);
      if(cs.visibility === "hidden" || cs.display === "none") continue;
      var bg = cs.backgroundColor;
      if(!bg || bg === "transparent" || bg.indexOf("rgba(0, 0, 0, 0)") === 0) continue;
      var rb = el.getBoundingClientRect();
      if(rb.width < 1 || rb.height < 1) continue;
      roundRect(ctx, rb.left, rb.top, rb.width, rb.height, parseFloat(cs.borderTopLeftRadius) || 0);
      ctx.fillStyle = bg;
      ctx.fill();
    }

    // ② 文字:逐個文字節點、逐行畫回原位
    var walker = document.createTreeWalker(sheet, NodeFilter.SHOW_TEXT, null, false);
    ctx.textBaseline = "bottom";
    var node;
    while((node = walker.nextNode())){
      if(!node.nodeValue || !node.nodeValue.trim()) continue;
      var pe = node.parentElement;
      if(!pe) continue;
      var ps = getComputedStyle(pe);
      if(ps.visibility === "hidden" || ps.display === "none") continue;
      ctx.font = ps.fontStyle + " " + ps.fontWeight + " " + ps.fontSize + " " + ps.fontFamily;
      ctx.fillStyle = ps.color;
      var lines = textLines(node);
      for(var L = 0; L < lines.length; L++){
        ctx.fillText(lines[L].text, lines[L].left, lines[L].bottom);
      }
    }

    // ③ QR 是 <canvas>,直接把它畫過來
    var qrc = document.getElementById("foot-qr-canvas");
    if(qrc && qrc.width){
      var rq = qrc.getBoundingClientRect();
      if(rq.width > 0) ctx.drawImage(qrc, rq.left, rq.top, rq.width, rq.height);
    }
    return cv;
  }

  function saveImage(format){
    var png = format === "png", mime = png ? "image/png" : "image/jpeg";
    var btn = document.getElementById(png ? "btn-png" : "btn-jpg");
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = "產生中…";

    /* 以 297mm 寬換算 300dpi = 3508×1973(16:9)。手機記憶體吃不下時退到 200、150dpi ——
       寧可解析度低一點,也不要按下去沒反應。 */
    var dpis = [300, 200, 150];

    function attempt(i){
      if(i >= dpis.length){
        btn.disabled = false; btn.textContent = label;
        alert("這台裝置的記憶體不夠產生圖片,請改用「列印/存 PDF」。");
        return;
      }
      var targetW = mode === "public-single" ? [6600, 4400, 2200][i] :
        mode === "public-large" ? [1170, 780, 390][i] : Math.round(297 / 25.4 * dpis[i]);
      var cv;
      /* 撷取期間把版面釘回桌面 16:9:量寬與逐字重畫都必須在這個版面下進行,否則手機的
         窄螢幕 2 欄版面會被畫進圖裡。paintSheet 是同步的,畫完 cv 已含像素,之後的
         toBlob 不再碰 DOM,所以撷取一結束就能立刻還原,不會讓使用者看到寬版閃一下。 */
      sheet.classList.add("exporting");
      try{
        fit();
        var basePx = sheet.getBoundingClientRect().width;   // 在桌面版面下量,scaleK 才正確
        cv = paintSheet(targetW / basePx);
      }catch(e){ cv = null; }
      finally{ sheet.classList.remove("exporting"); fit(); }
      if(!cv){ attempt(i + 1); return; }

      var name = (SITE.ORG_NAME || "產業小組表").replace(/[\\/:*?"<>|]/g, "") +
        (mode === "public-single" ? "_對外產業小組完整單張.jpg" :
          mode === "public-large" ? "_" + groupCode + "_對外產業小組大字圖.jpg" :
          mode === "public" ? "_對外產業小組圖.jpg" : "_產業小組表.jpg");
      if(png) name = name.replace(/\.jpg$/, ".png");
      var done = function(url, revoke){
        var a = document.createElement("a");
        a.href = url; a.download = name;
        a.rel = "noopener";
        document.body.appendChild(a); a.click(); a.remove();
        if(revoke) setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
        btn.disabled = false; btn.textContent = label;
      };
      if(cv.toBlob){
        cv.toBlob(function(blob){
          if(!blob){ attempt(i + 1); return; }
          done(URL.createObjectURL(blob), true);
        }, mime, png ? undefined : 0.95);
      } else {
        try{ done(cv.toDataURL(mime, png ? undefined : 0.95), false); }
        catch(e){ attempt(i + 1); }
      }
    }
    attempt(0);
  }
  document.getElementById("btn-jpg").addEventListener("click", function(){ saveImage("jpg"); });
  document.getElementById("btn-png").addEventListener("click", function(){ saveImage("png"); });
})();
</script>
</body>
</html>
