# data/ 底下的分組檔一有變動就自動:
#   內嵌照片轉實體檔 → 由 data/ 合併出 data.js → 重建成員分享頁 → 更新名冊 roster.csv
# 由 GITHUB_TOKEN 提交,不會觸發其他 workflow(GitHub 預設防迴圈)。
#
# ⚠ 這個 workflow 是前台更新的必經之路:data.js 是它產生的產出物,它失敗前台就不會更新。
#   12 位組長各自發布時很容易在同一分鐘內連續推送,先前就發生過「算完要推送時 main 已前進 →
#   推送被拒 → 整個同步失敗」。下方的重試迴圈就是為此:被拒時重抓最新的 main、重新產生
#   產出物再試(產出物完全由 data/ 決定,所以重算永遠安全,也不會有合併衝突)。
name: 同步網站資料
on:
  push:
    branches: [main]
    paths: ['data/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 同一時間只跑一個。cancel-in-progress: false 保證「正在跑的那個不會被砍掉」。
  #
  # ⚠ 但它**不是**「每個 run 都會輪到」:GitHub 對同一個 group 只保留**一個** pending,
  #   新的排進來會取消前一個 pending。12 位組長連續發布時,實際跑起來的通常只有兩個
  #   (第一個 + 最後一個),中間的都會顯示 Cancelled —— 那是正常的,不是故障。
  #
  # 收斂性靠的是**下面的重試迴圈**,不是這段設定:main 是線性歷史,存活下來那個 run 的
  # checkout sha 必然包含所有更早的 data/ 變更;推送被拒時再 reset 到當下的 main 重算。
  # ★ 所以請不要因為「反正 concurrency 會排隊」而拿掉重試迴圈 —— 拿掉的當下收斂性就沒了。
  group: sync-site-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 產生產出物並提交（推送被拒就重抓 main 重算再試）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generate() {
            node tools/extract-inline-photos.mjs
            node tools/build-data.mjs
            node tools/stamp-member-count.mjs   # 必須在 stamp-data-version 之前:它會改到 visitor.html
            node tools/stamp-data-version.mjs   # 必須在 build-data 之後:要對最終的 data.js 取雜湊
            node tools/build-member-pages.mjs
            node tools/build-roster.mjs
          }

          for attempt in 1 2 3 4 5; do
            generate
            git add -A
            if git diff --cached --quiet; then
              echo "沒有變更,不需提交。"
              exit 0
            fi
            git commit -m "自動同步:照片正規化/data.js/分享頁/名冊 CSV"
            if git push; then
              echo "已同步(第 $attempt 次嘗試)。"
              exit 0
            fi
            echo "::warning::推送被拒(第 $attempt 次)——main 已被其他發布推進,重抓後重算再試"
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 3))
          done

          echo "::error::推送重試 5 次仍失敗,前台可能未更新。請檢查是否有大量併發發布。"
          exit 1
